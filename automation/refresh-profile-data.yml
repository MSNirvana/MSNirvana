name: Refresh profile data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate real contribution route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-contribution-route.mjs
      - name: Validate generated profile
        run: node scripts/validate-profile.mjs
      - name: Commit changed route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity/contribution-route.svg assets/activity/contribution-route-mobile.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution route"
          git push
